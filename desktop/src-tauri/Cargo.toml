[package]
name = "bok-voice-desktop"
version = "0.1.0"
description = "Bok Voice desktop shell"
authors = ["Bok Voice"]
edition = "2021"

[lib]
name = "bok_voice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

