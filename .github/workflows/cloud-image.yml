name: Cloud CP image

# 云端控制面容器镜像：构建 → 起容器冒烟（/health + 管理台静态站）→ 推送 GHCR。
# PR 只构建+冒烟不推送；push 到 main / v* tag 才推（latest + sha-<short> + git tag）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, smoke, push CP image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GHCR 要求全小写仓库名（owner 可能含大写），在下方 step 里归一后回写
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      SMOKE_URL: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bok-cp:ci .

      - name: Smoke test (health + admin console)
        run: |
          set -euo pipefail
          # CP 启动锚（2026-09-21）：镜像 CMD --host 0.0.0.0 是非回环 bind，
          # 认证双关会被拒绝启动——冒烟必须给一份最小加固配置（auth-on +
          # 密钥分离：JWT secret ≥32 字节且与机器通道 CP token 异值）。
          # 两枚密钥**运行时随机生成**而非写死占位值：①写死的 `*-0123456789*` 形状
          # 会被 gitleaks 的 generic-api-key 命中（.gitleaks.toml 前言有实测记录），
          # 那会逼我们去放宽密钥门禁——用随机值则门禁零放宽；②顺带更贴近真实部署
          # 形态（真实密钥本来就是随机的）。
          docker run -d --name cp-smoke -p 127.0.0.1:18000:8000 \
            -e BOK_AUTH_REQUIRED=1 \
            -e BOK_JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
            -e BOK_CP_TOKEN="$(head -c 24 /dev/urandom | base64 | tr -d '\n')" \
            bok-cp:ci
          # 轮询等待 uvicorn 起监听：docker-proxy 秒级就绪而应用 ~1-2s 才 bind，
          # 该窗口 curl 会吃到 connection reset（exit 56）——旧 curl 不把它当
          # 瞬态错误重试（CI 首跑实证），必须显式循环兜住一切失败形态。
          for i in $(seq 1 30); do
            if curl -fsS "${SMOKE_URL}/health" > /tmp/cp-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          health="$(cat /tmp/cp-health.json 2>/dev/null || true)"
          echo "health: ${health}"
          [[ "${health}" == *'"ok":true'* ]] || { echo "health 响应不含 ok:true"; exit 1; }
          # 管理台静态站（Next.js 导出挂载在 CP 根路径），200 且是 HTML
          index_status="$(curl -sS -o /tmp/cp-index.html -w '%{http_code}' "${SMOKE_URL}/")"
          echo "GET / -> ${index_status}"
          [[ "${index_status}" == "200" ]] || { echo "管理台静态站未就绪"; exit 1; }
          grep -qi '<html' /tmp/cp-index.html || { echo "/ 返回内容不是 HTML"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker logs cp-smoke || true

      - name: Teardown smoke container
        if: always()
        run: docker rm -f cp-smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag + push to GHCR
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          image="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          tags=("latest" "sha-${GITHUB_SHA::7}")
          # v* tag 推送时额外打 git tag（refs/tags/v1.2.3 → v1.2.3）
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          for tag in "${tags[@]}"; do
            docker tag bok-cp:ci "${image}:${tag}"
            docker push "${image}:${tag}"
          done
