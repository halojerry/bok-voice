name: Compose rehearsal

# 「宝塔导入路径 + 一键脚本永远有效」排练门禁：deploy/cloud 的 compose/install.sh
# 一旦坏了（插值拼错、必填守卫误伤、镜像/健康语义漂移、env 契约变动未同步、
# install.sh 自身 bash 兼容坑），合入前就在 CI 用与云上一致的路径复现：
# 本地构建镜像 → **跑 deploy/cloud/install.sh 一键脚本本体**（env 生成→up→轮询
# →health/静态站/root 登录三验收，与客户侧执行的是同一份代码）→ 追加 JWT
# round-trip 断言。构建用本地 tag 不拉 GHCR——latest 滞后会掩盖回归。
on:
  push:
    branches: [main]
    paths:
      - "deploy/cloud/**"
      - ".github/workflows/compose-rehearsal.yml"
  pull_request:
    paths:
      - "deploy/cloud/**"
      - ".github/workflows/compose-rehearsal.yml"

concurrency:
  group: compose-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: One-click install rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 用 CI 本地构建的镜像（见下方 build 步骤），不拉 GHCR
      BOK_CP_IMAGE: ghcr.io/halojerry/bok-voice:ci
      CP_URL: http://127.0.0.1:18010
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local, no GHCR pull)
        run: docker build -t "${BOK_CP_IMAGE}" .

      - name: Run one-click install.sh (真实入口：env 生成→up→轮询→三验收)
        run: |
          set -euo pipefail
          # DATABASE_URL 走 host-gateway 指宿主上的 pg 服务容器（compose 有
          # extra_hosts 映射）；18010 排练专用口避开 8000。root 密码交给脚本
          # 随机生成（写进 deploy/cloud/.env，后续断言从那里读）。
          bash deploy/cloud/install.sh \
            --database-url 'postgresql+psycopg://postgres:postgres@host.docker.internal:5439/postgres' \
            --port 18010 \
            --image "${BOK_CP_IMAGE}"

      - name: Post-install assertions (JWT round-trip + env 契约)
        run: |
          set -euo pipefail
          root_password="$(grep '^BOK_ROOT_PASSWORD=' deploy/cloud/.env | cut -d= -f2-)"
          # install.sh 已验 root 登录拿 JWT；这里补 round-trip + 静态站裸可达
          # （v0.2.0 起静态 GET 豁免，浏览器裸开 / 必须 200 HTML 不是 401）。
          login_code="$(curl -sS -o /tmp/cp-login.json -w '%{http_code}' \
            -X POST "${CP_URL}/api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"${root_password}\"}")"
          [[ "${login_code}" == "200" ]] || { echo "root 登录失败 HTTP ${login_code}"; cat /tmp/cp-login.json; exit 1; }
          token="$(jq -r '.token // empty' /tmp/cp-login.json)"
          me="$(curl -sS -o /tmp/cp-me.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" "${CP_URL}/api/auth/me")"
          [[ "${me}" == "200" ]] || { echo "/api/auth/me HTTP ${me}"; exit 1; }
          [[ "$(jq -r '.role // empty' /tmp/cp-me.json)" == "root" ]] || { echo "身份不是 root"; exit 1; }
          index_status="$(curl -sS -o /tmp/cp-index.html -w '%{http_code}' "${CP_URL}/")"
          [[ "${index_status}" == "200" ]] || { echo "裸 GET / HTTP ${index_status}（期望 200：静态站豁免）"; exit 1; }
          grep -qi '<html' /tmp/cp-index.html || { echo "/ 返回内容不是 HTML"; exit 1; }
          stat -c '%a' deploy/cloud/.env | grep -qx 600 || { echo ".env 权限不是 600"; exit 1; }
          echo "post-install assertions: 4/4 OK（JWT 回程/静态站裸达/env 0600/镜像内静态产物）"

      - name: Idempotent re-run (升级路径 = 重跑脚本)
        run: |
          set -euo pipefail
          # 二次执行必须复用 .env（不重生成密钥/root 密码）并再次就绪。
          before="$(md5sum deploy/cloud/.env | cut -d' ' -f1)"
          bash deploy/cloud/install.sh \
            --database-url 'postgresql+psycopg://postgres:postgres@host.docker.internal:5439/postgres' \
            --port 18010 --image "${BOK_CP_IMAGE}" | grep -q "复用" || { echo "二次运行未走复用路径"; exit 1; }
          after="$(md5sum deploy/cloud/.env | cut -d' ' -f1)"
          [[ "${before}" == "${after}" ]] || { echo ".env 被重写（密钥轮换=事故）"; exit 1; }
          curl -fsS "${CP_URL}/health" | grep -q '"ok":true'

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f deploy/cloud/docker-compose.yml --env-file deploy/cloud/.env logs --no-color cp || true
          docker ps -a || true

      - name: Teardown
        if: always()
        run: docker compose -f deploy/cloud/docker-compose.yml --env-file deploy/cloud/.env down -v --remove-orphans || true
