name: Compose rehearsal

# 「宝塔导入路径永远有效」排练门禁：deploy/cloud 的 docker-compose.yml 一旦坏了
# （插值拼错、必填守卫误伤、镜像/健康语义漂移、env 契约变动未同步 .env.example），
# 合入前就在 CI 用与云上一致的路径复现：compose config → 本地构建镜像 →
# compose up → 健康断言。构建用本地 tag 不拉 GHCR——latest 滞后会掩盖回归。
#
# 真实 Postgres 用 job 级服务容器（写法照抄 postgres-smoke.yml，宿主口 5439），
# CP 容器经 host-gateway 连它——顺带把「compose 路径下 build_engine() 对真 PG
# 建表迁移 + root 种子 + 登录签发 JWT」整条链也排练进去了。
on:
  push:
    branches: [main]
    paths:
      - "deploy/cloud/**"
      - ".github/workflows/compose-rehearsal.yml"
  pull_request:
    paths:
      - "deploy/cloud/**"
      - ".github/workflows/compose-rehearsal.yml"

concurrency:
  group: compose-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Compose up + health rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 用 CI 本地构建的镜像（见下方 build 步骤），不拉 GHCR
      BOK_CP_IMAGE: ghcr.io/halojerry/bok-voice:ci
      CP_URL: http://127.0.0.1:18010
    steps:
      - uses: actions/checkout@v4

      - name: Generate rehearsal .env
        run: |
          set -euo pipefail
          # 生产同款 posture：auth-on + 随机密钥 + root 种子；DATABASE_URL 走
          # host-gateway 指宿主上的 pg 服务容器（compose 里有 extra_hosts 映射）。
          # BOK_CP_PORT=18010：排练专用口，避开 runner/宿主上可能占用的 8000。
          cat > deploy/cloud/.env <<EOF
          DATABASE_URL=postgresql+psycopg://postgres:postgres@host.docker.internal:5439/postgres
          BOK_AUTH_REQUIRED=1
          BOK_JWT_SECRET=$(openssl rand -hex 32)
          BOK_CP_TOKEN=$(openssl rand -hex 24)
          BOK_ROOT_USERNAME=root
          BOK_ROOT_PASSWORD=$(openssl rand -hex 16)
          BOK_CP_PORT=18010
          EOF
          chmod 600 deploy/cloud/.env

      - name: Validate compose config
        run: |
          set -euo pipefail
          # config 阶段就验出：yaml 语法 / ${VAR:?} 必填守卫 / 插值与端口映射形状
          # （config 输出是归一化格式，端口是 target/published 结构而非 a:b 字面量）
          docker compose -f deploy/cloud/docker-compose.yml --env-file deploy/cloud/.env config > /tmp/compose-config.yaml
          grep -q "image: ${BOK_CP_IMAGE}" /tmp/compose-config.yaml
          grep -q 'published: "18010"' /tmp/compose-config.yaml
          echo "compose config OK（镜像/端口插值生效）"

      - name: Build image (local, no GHCR pull)
        run: docker build -t "${BOK_CP_IMAGE}" .

      - name: Compose up
        run: |
          set -euo pipefail
          docker compose -f deploy/cloud/docker-compose.yml --env-file deploy/cloud/.env up -d
          # 显式轮询，别信 curl --retry-connrefused：docker-proxy 秒级就绪而
          # uvicorn 要等 startup（DB 迁移/种子）~数秒才 bind，窗口期连接被
          # reset（exit 56）——旧 curl 不把它当瞬态错误重试（CI 首跑实证，
          # cloud-image.yml 同款坑），必须显式循环兜住一切失败形态。
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS "${CP_URL}/health" > /tmp/cp-health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [[ -z "${ok}" ]]; then
            echo "::error::CP 60s 内未出健康响应"; exit 1
          fi

      - name: Assertions (health / static console / login chain)
        run: |
          set -euo pipefail
          # ① /health 返回 ok:true（豁免路径，裸 curl）
          health="$(cat /tmp/cp-health.json)"
          echo "health: ${health}"
          [[ "${health}" == *'"ok":true'* ]] || { echo "health 响应不含 ok:true"; exit 1; }

          # ② 管理台静态站 200 且是 HTML。带机器通道头取页：auth-on 下 identity_gate
          #    只豁免 API 精确路径，浏览器裸开 / 目前是 401（静态页未豁免的已知缺口，
          #    见 deploy/cloud/README.md §4）——此处断言的是「镜像里有静态站 + 机器
          #    通道可取到」，后端补豁免后本断言依然成立。
          cp_token="$(grep '^BOK_CP_TOKEN=' deploy/cloud/.env | cut -d= -f2-)"
          index_status="$(curl -sS -o /tmp/cp-index.html -w '%{http_code}' \
            -H "Authorization: Bearer ${cp_token}" "${CP_URL}/")"
          echo "GET / (machine token) -> ${index_status}"
          [[ "${index_status}" == "200" ]] || { echo "管理台静态站未就绪"; exit 1; }
          grep -qi '<html' /tmp/cp-index.html || { echo "/ 返回内容不是 HTML"; exit 1; }

          # ③ root 种子 + 登录签发 JWT（compose 路径下 build_engine 迁移真 PG 的回执）
          root_password="$(grep '^BOK_ROOT_PASSWORD=' deploy/cloud/.env | cut -d= -f2-)"
          login_code="$(curl -sS -o /tmp/cp-login.json -w '%{http_code}' \
            -X POST "${CP_URL}/api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"username\":\"root\",\"password\":\"${root_password}\"}")"
          [[ "${login_code}" == "200" ]] || { echo "root 登录失败 HTTP ${login_code}"; cat /tmp/cp-login.json; exit 1; }
          token="$(jq -r '.token // empty' /tmp/cp-login.json)"
          [[ -n "${token}" ]] || { echo "登录响应缺 token"; exit 1; }

          # ④ JWT round-trip：/api/auth/me 用签出的 token 取回 root 身份
          me="$(curl -sS -o /tmp/cp-me.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" "${CP_URL}/api/auth/me")"
          [[ "${me}" == "200" ]] || { echo "/api/auth/me HTTP ${me}"; exit 1; }
          [[ "$(jq -r '.role // empty' /tmp/cp-me.json)" == "root" ]] || { echo "身份不是 root"; exit 1; }
          echo "rehearsal assertions: 4/4 OK"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f deploy/cloud/docker-compose.yml --env-file deploy/cloud/.env logs --no-color cp || true
          docker ps -a || true

      - name: Teardown
        if: always()
        run: docker compose -f deploy/cloud/docker-compose.yml --env-file deploy/cloud/.env down -v --remove-orphans || true
