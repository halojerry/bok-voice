name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/core -e packages/business-db -e packages/knowledge -e packages/observability
          pip install -e "apps/control-plane" -e "apps/agent[livekit]"
      - name: Type-check / compile
        run: python -m compileall -q apps packages tools scripts
      - name: Run pytest
        run: python -m pytest -q tests/

  node:
    name: Node tests (realtime-translation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime-translation/package-lock.json
      - name: realtime-translation tests
        working-directory: services/realtime-translation
        run: |
          npm ci
          npm test

  web:
    name: Web typecheck + export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install + typecheck + build
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  bok:
    name: Launcher smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bok manifest
        run: python tools/bok.py manifest > /dev/null && echo "manifest ok"
      - name: bok status
        run: python tools/bok.py status
      - name: bok doctor (dev, non-blocking)
        run: python tools/bok.py doctor || true

  desktop:
    name: Desktop shell (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build web (frontendDist) + stub runtime resources
        run: |
          pushd apps/web && npm ci && npm run build && popd
          mkdir -p desktop/runtime
          bash scripts/stub_external_bin.sh
      - name: Cargo tests
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check
