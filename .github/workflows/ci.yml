name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Type-check / compile
        run: |
          python -m compileall -q apps packages tools scripts
      - name: Run pytest
        run: python -m pytest -q

  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: realtime-translation tests
        working-directory: services/realtime-translation
        run: |
          npm install
          npm test
      - name: web typecheck
        working-directory: apps/web
        run: |
          npm install
          npx tsc --noEmit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config validate
        run: docker compose config --quiet
      - name: Build images
        run: |
          docker compose build agent control-plane web

  bok:
    name: Launcher smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bok manifest
        run: python tools/bok.py manifest > /dev/null && echo "manifest ok"
      - name: bok status
        run: python tools/bok.py status

  desktop:
    name: Desktop shell (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo tests
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check
