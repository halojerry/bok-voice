name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/core -e packages/business-db -e packages/knowledge -e packages/observability
          pip install -e "apps/control-plane" -e "apps/agent[livekit]"
      - name: Type-check / compile
        run: python -m compileall -q apps packages tools scripts
      - name: Run pytest
        run: python -m pytest -q tests/

  node:
    name: Node tests (realtime-translation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime-translation/package-lock.json
      - name: realtime-translation tests
        working-directory: services/realtime-translation
        run: |
          npm ci
          npm test

  web:
    # name 必须与 main 分支保护的 required context 逐字一致("Web typecheck + export");
    # 改名=必检上下文永不出现→PR 永久 BLOCKED(2026-09-16 实证)。加步骤勿改 name。
    name: Web typecheck + export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install + typecheck + build
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Web unit tests (node --test)
        working-directory: apps/web
        run: npm test
      - name: Thin-client static probe (out/ 注入链形状 + 无烤死 localhost; runner python 即可,纯 stdlib)
        run: python scripts/probe_thin_client_static.py

  bok:
    name: Launcher smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bok manifest
        run: python tools/bok.py manifest > /dev/null && echo "manifest ok"
      - name: bok status
        run: python tools/bok.py status
      - name: bok doctor (dev, non-blocking)
        run: python tools/bok.py doctor || true
