name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ruff 新文件步需要与 base 的 diff 历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/core -e packages/business-db -e packages/knowledge -e packages/observability
          pip install -e "apps/control-plane" -e "apps/agent[livekit]"
      - name: Type-check / compile
        run: python -m compileall -q apps packages tools scripts
      - name: Ruff (real-bug rules, full tree)
        # 规范十条 R1 两层门之一:真 bug 类规则全树恒绿(vendored tojyutping 由
        # pyproject extend-exclude 排除;services/s2s fork 同款豁免,显式路径
        # 实测不绕豁免)。改 select 须同步 pyproject 注释与 .pre-commit-config.yaml。
        run: ruff check --no-cache --select F821,F811,F601,F702,E722,E713,E714 apps packages tools scripts services
      - name: Ruff (style rules, new files only)
        # 两层门之二:风格类(E501/F401/I001…)只对**本 PR 新增**的 .py 强制
        # (存量不整体 reformat,治理计划定案;G2 拆包新模块天然生在全量规则下)。
        # vendored 树(tojyutping_vendor / services/s2s fork)不追风格——保持可对上游
        # diff;我们的自有码在 apps/packages/tools/scripts/services 下全量受检。
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          ADDED=$(git diff --diff-filter=A --name-only "${BASE:-HEAD~1}...HEAD" -- '*.py' \
            | grep -v '^packages/core/bok_voice_core/tojyutping_vendor/' \
            | grep -v '^services/s2s/' || true)
          echo "new .py files: ${ADDED:-<none>}"
          if [ -n "$ADDED" ]; then xargs ruff check --no-cache <<< "$ADDED"; fi
      - name: Run pytest
        run: python -m pytest -q tests/
      - name: Scripts import smoke (G1c)
        # 每个受管脚本按「直接运行姿势」进程内 import——搬错桶/漏改 import/
        # 引导头丢失在这里现形(治理计划 §G1c 验收令;SKIP-DEP=CI 精简环境缺
        # 训练栈,预期内)。
        run: python scripts/ops/import_smoke.py

  web:
    # name 必须与 main 分支保护的 required context 逐字一致("Web typecheck + export");
    # 改名=必检上下文永不出现→PR 永久 BLOCKED(2026-09-16 实证)。加步骤勿改 name。
    name: Web typecheck + export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install + typecheck + build
        working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Customer artifact vendor-literal gate (W④ 2026-10-09)
        # SaaS 姿态：客户产物零厂商字面量（minimax/deepseek/doubao/豆包/火山/
        # volcano/bytedance/qwen）——命中即构建失败。与源码面
        # tests/test_vendor_literal_hygiene.py 双保险（产物级 grep 连 minify 后
        # 的字符串/属性名都扫）。-I=跳二进制（mp3 试听资产的字节噪声会碰巧
        # 拼出厂商词，文件名本身是中性音色 id——CI 实弹翻车钉死）。
        working-directory: apps/web
        run: |
          if grep -rilEI "minimax|deepseek|doubao|豆包|火山|volcano|bytedance|qwen" out/ ; then
            echo "::error::客户产物含厂商字面量（见上列文件）"; exit 1
          fi
      - name: Platform console build (W④ 双构建对照档)
        working-directory: apps/web
        run: npm run build:platform
      - name: Web unit tests (node --test)
        working-directory: apps/web
        run: npm test
      - name: Thin-client static probe (out/ 注入链形状 + 无烤死 localhost; runner python 即可,纯 stdlib)
        run: python scripts/probes/probe_thin_client_static.py
      # W⑧-8 供应链审计（advisory：存量有 high 级发现，清零后翻 blocking——
      # 见 docs/SECURITY-SAAS.md §6）。
      - name: pip-audit (advisory, W⑧)
        run: pip install pip-audit >/dev/null 2>&1 && pip-audit --skip-editable || echo "::warning::pip-audit 有发现（advisory 档）"
        continue-on-error: true
      - name: npm audit (advisory, W⑧)
        working-directory: apps/web
        run: npm audit --audit-level=high || echo "::warning::npm audit 有 high 级发现（advisory 档）"
        continue-on-error: true

  bok:
    name: Launcher smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bok manifest
        run: python tools/bok.py manifest > /dev/null && echo "manifest ok"
      - name: bok status
        run: python tools/bok.py status
      - name: bok doctor (dev, non-blocking)
        run: python tools/bok.py doctor || true
