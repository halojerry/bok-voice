name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            artifact: mac
          - os: windows-latest
            target: windows
            artifact: exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Cache bundled runtime + dependency caches
        uses: actions/cache@v4
        with:
          path: |
            desktop/runtime
            desktop/src-tauri/binaries
            ~/.cache/pip
            services/realtime-translation/node_modules
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-runtime-v3-${{ hashFiles('requirements-runtime-*.txt','packages/**/pyproject.toml','apps/**/pyproject.toml','services/realtime-translation/package-lock.json') }}

      - name: Install Python deps (runner, for tests/manifest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/core -e packages/business-db -e packages/knowledge -e packages/observability
          pip install -e "apps/control-plane" -e "apps/agent[livekit]"

      - name: Build release assets (web export + icons + manifest; tests already ran in CI)
        shell: bash
        env:
          SKIP_TESTS: "1"
        run: bash scripts/build_release.sh

      - name: Build bundled runtime (Python/Node/LiveKit/llama)
        shell: bash
        run: bash scripts/build_runtime.sh

      - name: Install Tauri CLI
        run: cd desktop && npm ci

      - name: Derive platform icons
        run: cd desktop && npx tauri icon src-tauri/icons/icon.png

      - name: Build desktop app
        shell: bash
        run: |
          cd desktop
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx tauri build --bundles nsis
          else
            npx tauri build --bundles app
            zip -r -y "BokVoice-mac.zip" "src-tauri/target/release/bundle/macos/BokVoice.app" >/dev/null
          fi

      - name: Verify bundle (staging)
        shell: bash
        run: bash scripts/verify_bundle.sh --staging

      - name: Verify built app + bundled doctor (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/verify_bundle.sh --app desktop/src-tauri/target/release/bundle/macos/BokVoice.app
          bash scripts/verify_bundle.sh --doctor desktop/src-tauri/target/release/bundle/macos/BokVoice.app

      - name: Verify Windows artifacts (llama-server CUDA + NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la desktop/runtime/llama/ | head -20
          desktop/runtime/llama/llama-server.exe --version
          test -f desktop/src-tauri/target/release/bundle/nsis/*.exe && echo "NSIS exe present"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bok-voice-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
            desktop/BokVoice-mac.zip
            models.sha256.json
          retention-days: 7

  manifest:
    name: Manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate model manifest
        run: python tools/bok.py manifest > models.sha256.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: model-manifest
          path: models.sha256.json
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List downloaded assets
        run: find release-assets -type f | sed 's#release-assets/##' | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "==> creating release for tag ${TAG} (version ${VERSION})"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          ASSETS=()
          for f in $(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name 'models.sha256.json' \)); do
            ASSETS+=("$f")
          done
          gh release create "${TAG}" \
            --title "Bok Voice ${VERSION}" \
            --notes "自包含桌面发行：内嵌前端/运行时/二进制；模型首启下载；零 Ollama/零 Docker。" \
            "${ASSETS[@]}"
          echo "==> release created"
