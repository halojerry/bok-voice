name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            artifact: dmg
          - os: windows-latest
            target: windows
            artifact: msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # 复用上一轮构建好的运行时光（venv/Node/LiveKit）与依赖缓存，
      # 避免每个平台从零下载 ~1.8GB 依赖（这是之前 Windows 打包慢的主因）。
      - name: Cache bundled runtime + dependency caches
        uses: actions/cache@v4
        with:
          path: |
            desktop/runtime
            ~/.cache/pip
            services/realtime-translation/node_modules
            ~/.cache/go-build
            ~/go/pkg/mod
          # v2: bust the cache so the relocatable-standalone-python runtime is
          # rebuilt (previous cached venv used a non-relocatable framework Python).
          key: ${{ runner.os }}-runtime-v2-${{ hashFiles('packages/**/pyproject.toml','apps/**/pyproject.toml','services/*/requirements.txt','services/realtime-translation/package-lock.json') }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/core -e packages/business-db -e packages/knowledge -e packages/observability
          pip install -e "apps/control-plane" -e "apps/agent[livekit]"

      - name: Build release (script)
        shell: bash
        run: bash scripts/build_release.sh

      - name: Build bundled runtime (venv/Node/LiveKit)
        shell: bash
        run: bash scripts/build_runtime.sh

      - name: Setup Tauri dependencies (Linux/macOS)
        if: runner.os == 'macOS'
        run: echo "macOS Tauri deps are preinstalled on macOS runners"

      - name: Install Tauri CLI
        run: cd desktop && npm install

      - name: Derive platform icons
        run: cd desktop && npx tauri icon src-tauri/icons/icon.png

      - name: Build desktop app
        run: |
          cd desktop
          if [ "$RUNNER_OS" = "Windows" ]; then
            # NSIS installers (.exe) are faster than WiX MSI and avoid the slow
            # MSI bundling of the large self-contained runtime.
            npx tauri build --bundles nsis
          else
            # Bundle as a macOS .app only. `create-dmg` (bundle_dmg.sh) fails on
            # the macos runner for the large self-contained runtime (hdiutil mount
            # round-trip times out on GB-scale images); the .app is enough and we
            # zip it for distribution.
            npx tauri build --bundles app
            zip -r -y "BokVoice-mac.zip" "src-tauri/target/release/bundle/macos/BokVoice.app" >/dev/null
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bok-voice-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
            desktop/BokVoice-mac.zip
            models.sha256.json

  manifest:
    name: Manifest + image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate model manifest
        run: python tools/bok.py manifest > models.sha256.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: model-manifest
          path: models.sha256.json
      - name: Build docker images
        run: docker compose build agent control-plane web

  publish:
    name: Publish GitHub Release
    needs: [build, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List downloaded assets
        run: find release-assets -type f | sed 's#release-assets/##' | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tag name (strip leading 'v' for display)
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "==> creating release for tag ${TAG} (version ${VERSION})"
          # Delete existing release if re-running (artifact regeneration).
          gh release delete "${TAG}" --yes 2>/dev/null || true
          # Collect installers + manifest.
          ASSETS=()
          for f in $(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name 'models.sha256.json' \)); do
            ASSETS+=("$f")
          done
          gh release create "${TAG}" \
            --title "Bok Voice ${VERSION}" \
            --notes "自包含桌面发行：内嵌前端/运行时/Go 编译 livekit-server；模型首启下载。" \
            "${ASSETS[@]}"
          echo "==> release created"
