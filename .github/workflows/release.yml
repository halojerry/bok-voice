name: Release

# 发版管线（2026-09-17 Tauri 退役后）：tag 触发 → 双平台组装 runtime + 打
# 代码包/运行时包 → 冒烟 → GitHub Release（私有仓=私有资产）。操作员随后
# `deploy/cloud/publish_node_pkg.sh <版本>` 推到云 CP 工件卷，客户节点经
# license/node_token 鉴权下载——交付链零 GitHub、零桌面安装包。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-pkg:
    name: Node package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime-translation/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Cache runtime + dependency caches
        uses: actions/cache@v4
        with:
          path: |
            runtime
            ~/.cache/pip
            services/realtime-translation/node_modules
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-runtime-v4-${{ hashFiles('requirements-runtime-*.txt','packages/**/pyproject.toml','apps/**/pyproject.toml','services/realtime-translation/package-lock.json') }}

      - name: Assemble bundled runtime (Python/Node/LiveKit/llama)
        shell: bash
        run: bash scripts/build_runtime.sh

      - name: Verify runtime staging
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f runtime/python/python.exe
            test -f runtime/llama/llama-server.exe
            runtime/llama/llama-server.exe --version
          else
            test -x runtime/python/bin/python3
            test -n "$(ls runtime/livekit-server* 2>/dev/null || ls runtime/ 2>/dev/null)"
          fi

      - name: Build node packages (code + runtime)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          bash scripts/build_node_pkg.sh "$VER"
          bash scripts/build_runtime_pkg.sh "$VER"

      - name: Smoke node package (layout + version injection)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p smoke && tar -xzf "release-artifacts/bok-node-${VER}.tar.gz" -C smoke
          test -f "smoke/bok-node-${VER}/tools/node_agent.py"
          test -f "smoke/bok-node-${VER}/scripts/install-node.sh"
          echo "VERSION in package: $(cat smoke/bok-node-${VER}/VERSION)"
          [ "$(cat smoke/bok-node-${VER}/VERSION)" = "$VER" ]

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-pkg-${{ matrix.target }}
          path: release-artifacts/*
          retention-days: 7
          if-no-files-found: error

  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate model manifest
        run: python tools/bok.py manifest > models.sha256.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: model-manifest
          path: models.sha256.json
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [node-pkg, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List downloaded assets
        run: find release-assets -type f | sed 's#release-assets/##' | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "==> creating release for tag ${TAG} (version ${VERSION})"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          ASSETS=()
          for f in $(find release-assets -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name 'models.sha256.json' \)); do
            ASSETS+=("$f")
          done
          gh release create "${TAG}" \
            --title "Bok Voice ${VERSION}" \
            --notes "节点分发行：代码包 + 预构建运行时（经云 CP 鉴权分发，客户侧零 GitHub）。升级走 commands 通道（update <version>）。" \
            "${ASSETS[@]}"
          echo "==> release created"
