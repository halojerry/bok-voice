port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

redis:
  # 单机本地开发可不配置；生产多副本/egress/sip 时必须
  # address: redis:6379

keys:
  devkey: devsecret

prometheus_port: 6789

# 崩溃补位 webhook(可选):agent 离开房间 → CP 自动重派(见 /api/webhook/livekit)。
# 指向本机 CP(外网可达则填 http://<host>:8000/api/webhook/livekit;签名用下方 api_key)。
# webhook:
#   urls:
#     - http://127.0.0.1:8000/api/webhook/livekit
#   api_key: devkey

logging:
  level: info
  json: true
  # 注意:livekit-server 1.13.6 的 config.LoggingConfig 不支持 sampler 字段
  # (加了直接 config parse error 起不来);采样留待升级支持后再启。

