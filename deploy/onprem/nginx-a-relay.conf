# ============================================================================
# Bok Voice —— 厂商云（A 机）nginx：管理面入口 + MiniMax 云 TTS 中继
# ============================================================================
# 一台机器、同一个 443、两个职责：
#   /bok-cp/   → http://127.0.0.1:8000/   厂商侧管理控制面（root 控制台 +
#              节点注册表 /api/nodes/*：心跳、commands、更新分发）。
#              ⚠ 公网可达前必须再加防护（见 location 内注释位）。
#   /minimax/  → https://api.minimax.cn/  MiniMax 云 TTS 中继：客户现场 B 机
#              的 worker 只打这里，云凭据只存在于本机（下文凭据注入节）。
#
# 部署位置：/etc/nginx/conf.d/bok-a-relay.conf
#   ⚠ 含 map 指令（http 层），必须放 http 级 include 目录，勿放 server 级 include。
#
# ── MiniMax 凭据注入（关键安全设计）────────────────────────────────────────
# 上游 MiniMax 的 Authorization 头由本机 nginx 统一注入；注入指令**不写在本
# 文件里**，而是 include 一个独立 snippet（location /minimax/ 内那行 include）：
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo install -m 600 -o root /dev/null /etc/nginx/snippets/minimax-auth.conf
#   sudoedit /etc/nginx/snippets/minimax-auth.conf
#     # 内容只有一行：一个 proxy_set_header Authorization 指令，值为 MiniMax
#     # 开放平台控制台签发的凭据原文（含 "Bearer " 前缀，与官方 HTTP 调用
#     # 姿势一致——代理层覆盖客户端同名头）。
#   sudo chown root:root /etc/nginx/snippets/minimax-auth.conf
#   sudo chmod 600 /etc/nginx/snippets/minimax-auth.conf
#
# 本仓库、本配置文件、A 机镜像/compose 永不落任何真实或示例凭据字面量；
# 真实值只进上面那个 root 属主 0600 的 snippet。B 机 env 的 MINIMAX_API_KEY
# 留空即可——B worker 发出的同名头会被这里的 proxy_set_header 覆盖。
#
# ── 客户侧接线（B 机 worker env，完整接线表见同目录 README.md §5）───────────
#   MINIMAX_BASE_URL=https://<A 机地址>/minimax/v1/t2a_v2
#       ↑ HTTP 整段合成兜底。注意 agent 代码把该值当**完整端点 URL**用
#         （providers/livekit_plugins.py `_endpoint()` 原样 POST），不是裸 host。
#   MINIMAX_WS_URL=wss://<A 机地址>/minimax/ws/v1/t2a_v2
#       ↑ bidi 持久连接主路径（默认 WS 模式）；代码自动补 `_bidi` 后缀，
#         这里不要自己带。两个 env 都指 A 中继后，云凭据永不落 B 机，
#         MiniMax 云侧只见 A 机出口 IP。
#
# 证书：A 机有公网域名 → 建议 Let's Encrypt（certbot --nginx -d <A 机域名>）。
# 若用自签，B 机（agent worker 的 httpx/websockets 客户端）必须把 A 机证书
# 装进系统信任链，否则中继调用全部证书校验失败——能上真域名就别自签。
# 改完校验并生效：sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# WebSocket 升级头映射（http 层指令，勿挪进 server）：MiniMax bidi 是 wss
# 持久连接（一连接一整个 call），经本反代时靠它透传 Upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- http → https 跳转 ----------------------------------------------------
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 验证路径放行（certbot 需要经 80 到达）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Let's Encrypt 证书路径（certbot 签发后按实际域名替换；自签则换自签路径）
    ssl_certificate     /etc/letsencrypt/live/<A 机域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<A 机域名>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── 1) 厂商管理面（⚠ 公网可达前必须启用至少一层防护）─────────────────────
    # root 控制台 + 节点注册/心跳/更新分发都从这里过。下面两层防护按需打开
    # （推荐都开；a 是 allow/deny 列表，b 是 Basic Auth）：
    #   a) IP 白名单：厂商办公网出口 IP + B 机 WireGuard 地址
    #      # allow 203.0.113.8;          # 厂商办公网出口（示例，按现场替换）
    #      # allow 10.66.66.2;            # B 机 WireGuard 地址（示例）
    #      # deny  all;
    #   b) Basic Auth：htpasswd -c /etc/nginx/.htpasswd <厂商账号>（密码交互输入，
    #      不落任何脚本/仓库）
    #      # auth_basic           "bok vendor console";
    #      # auth_basic_user_file /etc/nginx/.htpasswd;
    location /bok-cp/ {
        # 带尾斜杠 → 剥掉 /bok-cp/ 前缀：/bok-cp/api/nodes/heartbeat → 上游 /api/nodes/heartbeat
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # B 机 node_agent 的心跳/注册是出站长轮询形态、报告类端点耗时较长，放宽读超时
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── 2) MiniMax 云 TTS 中继 ─────────────────────────────────────────────
    # ⚠ 开放中继=公网白嫖烧云配额。建议二选一收敛：
    #    防火墙把 443 收敛到 WireGuard 对端网段；或打开下面 allow/deny
    #    （网段按现场 WireGuard 配置替换）：
    #      # allow 10.66.66.0/24;   # WireGuard 网段
    #      # deny  all;
    location /minimax/ {
        # 带尾斜杠 → 前缀剥离后与官方 API 路径一一对应：
        #   /minimax/v1/t2a_v2        → https://api.minimax.cn/v1/t2a_v2        （HTTP）
        #   /minimax/ws/v1/t2a_v2_bidi→ https://api.minimax.cn/ws/v1/t2a_v2_bidi（WS 升级）
        proxy_pass https://api.minimax.cn/;
        proxy_ssl_server_name on;            # 上游 TLS 握手带 SNI（按域名对证书）
        proxy_set_header Host api.minimax.cn; # 上游按 Host 路由，必须覆写
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        # 凭据注入（覆盖客户端同名头）——真实凭据只活在
        # /etc/nginx/snippets/minimax-auth.conf（root 属主 0600），本文件零字面量。
        include /etc/nginx/snippets/minimax-auth.conf;

        # MiniMax bidi 走 WebSocket（wss）升级；HTTP 整段合成同 location 兼容
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # bidi 一连接一整个 call——长超时防合成中途被网关掐线
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;                 # 音频流逐段转发，不在网关攒
    }
}
