# ============================================================================
# Bok Voice —— 客户现场一体机（B 机）nginx 反代
# ============================================================================
# 角色：客户局域网的唯一入口。运营者浏览器只认 https://<一体机局域网地址>/。
# 拓扑背景见 docs/RUNTIME_TOPOLOGY.md §0 与同目录 README.md。
#
#   /            → 运营台静态站（apps/web 静态导出，落 /opt/bok/web/out）
#   /api/        → 本机控制面 FastAPI 127.0.0.1:8000（CP 只绑回环，永不直接暴露）
#   /ws  /rtc    → LiveKit 信令 127.0.0.1:7880（WebSocket 升级；
#                  WebRTC 媒体不走这里——UDP 7882 / TCP 7881 局域网直连，
#                  防火墙需放行，见同目录 README.md 防火墙表）
#
# 部署位置：/etc/nginx/conf.d/bok-b.conf
#   ⚠ 本文件含 map 指令（http 层），必须放在 http 级 include 目录
#     （Debian 系=conf.d/ 或 sites-available + http 级 include；
#     放进 server 级 include 会报 "map directive is not allowed here"）。
#
# ── 自签证书生成（B 机一次性执行；浏览器豁免说明见同目录 README.md §2）──────
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
#     -keyout /etc/nginx/ssl/bok-appliance.key -out /etc/nginx/ssl/bok-appliance.crt \
#     -subj "/CN=bok-appliance" \
#     -addext "subjectAltName=DNS:bok-appliance,IP:192.168.1.10"
#   # ↑ IP 按一体机实际局域网地址替换（多地址就多写几个 IP: 条目）。
#
# 改完校验并生效：
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# WebSocket 升级头映射（http 层指令，勿挪进 server）：
# 非升级请求 $http_upgrade 为空 → Connection 头传 close，普通 HTTP 不受影响。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    # 自签证书（生成命令见文件头注释）
    ssl_certificate     /etc/nginx/ssl/bok-appliance.crt;
    ssl_certificate_key /etc/nginx/ssl/bok-appliance.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 音频上传走 /api/：TTS 声纹克隆参考音频、知识库导入等 FormData，
    # 64m 给足余量（超出=413，运营侧表现为上传失败）。
    client_max_body_size 64m;

    # ---- 运营台静态站（apps/web 静态导出；发新版=整体替换 /opt/bok/web/out）----
    root  /opt/bok/web/out;
    index index.html;

    # 导出配置 trailingSlash:true —— 路由=目录/index.html（/calls/、/studio/…），
    # $uri/ 命中目录后由 index 指令交出 index.html；末段兜底回 index.html
    # 覆盖前端路由直开（SPA 刷新）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容指纹，可长缓存（换版本=新文件名，无失效问题）
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 本机控制面 FastAPI（只绑 127.0.0.1:8000，经此处对局域网暴露）--------
    location /api/ {
        # 带尾斜杠 → 前缀原样透传（/api/xxx → 127.0.0.1:8000/api/xxx）
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报表/聚类/学习驾驶舱端点（/api/reports/*、/api/stats/*、/api/qa/cluster）
        # 背后是全量 turns 扫描或本地 LLM 批判，耗时数十秒——读超时放宽，
        # 别用默认 60s 把长报表掐死在网关。
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering off;   # 长响应逐段直达浏览器，别在网关攒
    }

    # ---- LiveKit 信令 WebSocket（音频会话长连接）----------------------------
    # LiveKit 服务端配置（services/livekit-server/livekit.yaml）信令只绑
    # 127.0.0.1——对外统一由本 nginx 出。客户端 SDK 连 wss://<B 地址>/rtc?access_token=…
    # （query 原样透传）；/ws 是服务端 SDK/校验通道，一并放行。
    # 媒体不经此反代：UDP 7882（TCP 7881 备援）局域网直连，见 README 防火墙表。
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;                       # WS 升级必需
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 通话一通可长达数十分钟，信令连接保持常开——给足超时防中途掐线
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }
}
