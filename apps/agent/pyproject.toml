[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bok-voice-agent"
version = "0.1.0"
description = "Bok Voice LiveKit Agent"
requires-python = ">=3.11"
dependencies = [
  "bok-voice-core",
  "bok-voice-obs",
]

[project.optional-dependencies]
livekit = [
  # 1.8.0(GA 2026-09-05)含打断后 playout pause 泄漏修复(release stale
  # transcript gates and playout pauses #7083 + restore speaking state #7087
  # + cancel parked preemptive before pausing #6865)——1.7.1 实测一次打断后
  # 本通所有回复哑火只剩心跳(call-e49bd34d)。当年锁 <1.8 是 1.8 pre-release
  # 时序 flake,GA 版全量 311 测试已过。锁 <1.9 待下个 GA 再评。
  "livekit-agents>=1.8.0,<1.9",
  # OpenAI 兼容 LLM 基类(livekit_plugins 顶层 import,未声明则 CI 收集期即炸)。
  "livekit-plugins-openai>=1.8.0,<1.9",
  # Local offline SenseVoice ASR via sherpa-onnx (zh/en/ja/ko/yue).
  "sherpa-onnx>=1.13,<2",
  # Volcano (火山) streaming TTS uses a WebSocket binary protocol.
  "websockets>=13,<15",
  # Local Qwen3 ASR/TTS sidecars are called over HTTP.
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
