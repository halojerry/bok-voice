[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bok-voice-control-plane"
version = "0.1.0"
description = "Bok Voice Control Plane REST API"
requires-python = ">=3.11"
dependencies = [
  "bok-voice-core",
  "bok-voice-business-db",
  "bok-voice-knowledge",
  "fastapi>=0.110",
  "livekit-api>=1.2,<2",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]
