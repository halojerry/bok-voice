# 只承载工具配置,不声明 [project](包语义各归 apps/*/packages/* 自己的 pyproject,
# pytest 配置在 pytest.ini 不动)。
[tool.ruff]
line-length = 120
# vendored 树排除(上游原样,我们的补丁也不在此树追风格):
#  - tojyutping_vendor:粤拼库(MIT),tab 缩进/长行是上游原样
#  - services/s2s:HF speech-to-speech fork(含我们补丁=自有码,安全扫描
#    按自有码修,但风格层保持可对上游 diff,不重排)
extend-exclude = ["packages/core/bok_voice_core/tojyutping_vendor", "services/s2s"]

[tool.ruff.lint]
# 规范十条 R1(2026-10-04,Ethan「能被工具强制的才是规范」):Ruff 单工具链,
# select=E/F/W/I。存量风格债不整体清(治理计划定案「存量不整体 reformat」),
# 分两层执行:
#  ① 真 bug 类规则 = **全树** CI 门禁,现在就绿:
#     F821(undefined-name)/F811(重复定义覆盖)/F601(字典键重复)/F702/E722/
#     E713/E714 —— CI 与 pre-commit 都跑这一层;
#  ② 风格类(E501/W191/F401/I001…) = 只对**新增文件**强制(CI diff-filter=A 步);
#     存量文件的存量行不追——G2 拆包新模块天然生在全量规则之下。
# 改本 select 须同步 .github/workflows/ci.yml 两步与 .pre-commit-config.yaml。
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# scripts/**:G1 引导头(8 行固定形状,tests/test_script_bootstrap.py 钉形)与
# isort/E402/E401 结构性冲突——头块必须在 docstring/__future__ 之后、业务
# import 之前,单行双 import 是契约形状。排序/位置类规则在 scripts 让位;
# E501/F401 等其余风格规则照常生效。
"scripts/**" = ["I001", "E402", "E401"]
